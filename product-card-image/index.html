<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product_card_image</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="product-card">
      <div class="product-image">
        <img src="/photo-1505740420928-5e560c06d30e.jpg" alt="هدفون" />
        <span class="badge">۲۰٪ تخفیف</span>
        <button class="wishlist-btn">♡</button>
      </div>
      <div class="product-info">
        <span class="category">لوازم جانبی</span>
        <h3 class="product-title">هدفون بی‌سیم سونی WH-1000XM5</h3>
        <p class="product-desc">هدفون با قابلیت حذف نویز</p>
        <div class="product-rating">
          <span class="stars">★★★★☆</span>
          <span class="count">(۱۲۵)</span>
        </div>
        <div class="product-price">
          <span class="current-price">۸,۵۰۰,۰۰۰ تومان</span>
          <span class="original-price">۱۰,۵۰۰,۰۰۰</span>
        </div>
        <button class="add-to-cart">افزودن به سبد خرید</button>
      </div>
    </div>
  </body>
</html>
